<div class="hero">

    <h1><mat-icon>{{ fileIcon }}</mat-icon>   File Processing Platform</h1>

    <p>
        Process your documents quickly and securely.
    </p>

    <p>
        Merge PDFs • Convert Images • Extract Pages
    </p>

</div>

<div class="feature-container">

    <mat-card class="feature-card">

        <mat-card-header>

            <mat-card-title>
                📑 Merge Documents
            </mat-card-title>

        </mat-card-header>

        <mat-card-content>

            Merge PDF files and images into a single PDF document.

        </mat-card-content>

        <mat-card-actions>

            <button
                mat-raised-button
                color="primary"
                routerLink="/merge">

                Open

            </button>

        </mat-card-actions>

    </mat-card>

    <mat-card class="feature-card">

        <mat-card-header>

            <mat-card-title>

                ✂ Extract Pages

            </mat-card-title>

        </mat-card-header>

        <mat-card-content>

            Create a new PDF by selecting a page range.

        </mat-card-content>

        <mat-card-actions>

            <button
                mat-raised-button
                color="accent"
                routerLink="/split">

                Open

            </button>

        </mat-card-actions>

    </mat-card>

</div>

<div class="page-container">

    <div class="page-header">

        <h2>Merge Documents</h2>

        <p>
            Combine multiple PDF and image files into one PDF document.
        </p>

    </div>

    <mat-card class="section-card">

        <app-document-upload
            (filesSelected)="onFilesSelected($event)">
        </app-document-upload>

    </mat-card>

    <mat-card
        class="section-card"
        *ngIf="selectedFiles.length">

        <app-file-list
            [files]="selectedFiles"
            (remove)="removeFile($event)">
        </app-file-list>

    </mat-card>

    <button
        class="action-btn"
        mat-raised-button
        color="primary"
        (click)="mergeDocuments()"
        [disabled]="selectedFiles.length===0 || loading">

        <mat-icon>merge</mat-icon>

        {{loading ? 'Processing...' : 'Merge Documents'}}

    </button>

    <mat-card
        class="progress-card"
        *ngIf="loading">

        <h3>Processing document...</h3>

        <mat-progress-bar
            mode="determinate"
            [value]="uploadProgress">
        </mat-progress-bar>

        <p>{{uploadProgress}}%</p>

    </mat-card>

    <app-result-card
        *ngIf="response"
        [documentName]="response.documentName"
        (download)="downloadFile()">
    </app-result-card>

</div>
